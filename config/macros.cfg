# Macros for the Geeetech M1S under Klipper.
#
# Positions used by the nozzle wipe are variables on _M1S_VARS so they can be
# changed from the console with SET_GCODE_VARIABLE while finding the pad.
# The stock firmware's G29 sequence is: heat nozzle to 140 C and bed to 50 C,
# wipe, tare the probe, probe. CLEAN_NOZZLE / AUTO_LEVEL_* reproduce that.

[gcode_macro _M1S_VARS]
description: Tunables for the M1S macros
# Silicone wiper pad. Stock homes X to max (115) and the bed is 100 wide, so
# the pad is almost certainly in the X 100..115 strip. Find it by jogging.
variable_wipe_x_start: 104
variable_wipe_x_end: 114
variable_wipe_y: 55
variable_wipe_z: 0.5
variable_wipe_passes: 6
variable_wipe_speed: 6000      # mm/min
variable_probe_nozzle_temp: 140
variable_probe_bed_temp: 50
variable_tare_settle: 3.0      # seconds to wait after a tare before probing
gcode:

# ---------------------------------------------------------------------------
# Probe helpers
# ---------------------------------------------------------------------------

[gcode_macro _PROBE_TARE]
description: Pulse the head MCU tare line and wait out its ready pulse
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    SET_PIN PIN=probe_tare VALUE=1
    G4 P50
    SET_PIN PIN=probe_tare VALUE=0
    G4 P{ (v.tare_settle * 1000) | int }

[gcode_macro _PROBE_HEAT]
description: Bring nozzle and bed to the stock probing temperatures
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    M140 S{v.probe_bed_temp}
    M104 S{v.probe_nozzle_temp}
    M190 S{v.probe_bed_temp}
    M109 S{v.probe_nozzle_temp}

# ---------------------------------------------------------------------------
# Nozzle cleaning
# ---------------------------------------------------------------------------

[gcode_macro CLEAN_NOZZLE]
description: Wipe the nozzle on the silicone pad. HEAT=0 skips heating.
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    {% set heat = params.HEAT | default(1) | int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if heat %}
        M109 S{v.probe_nozzle_temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=clean_nozzle
    G90
    G1 Z{v.wipe_z + 5} F1200
    G1 X{v.wipe_x_start} Y{v.wipe_y} F{v.wipe_speed}
    G1 Z{v.wipe_z} F600
    {% for i in range(v.wipe_passes) %}
        G1 X{v.wipe_x_end} F{v.wipe_speed}
        G1 X{v.wipe_x_start} F{v.wipe_speed}
    {% endfor %}
    G1 Z{v.wipe_z + 5} F1200
    RESTORE_GCODE_STATE NAME=clean_nozzle
    M117 Nozzle cleaned

# ---------------------------------------------------------------------------
# Bed leveling. Both variants heat, wipe, tare, then probe. The mesh is saved
# under a profile; run SAVE_CONFIG afterwards to persist it.
# ---------------------------------------------------------------------------

[gcode_macro AUTO_LEVEL_16]
description: Full 4x4 (16 point) bed mesh, same as the stock auto-level
gcode:
    _LEVEL_COMMON COUNT=4,4 PROFILE=default

[gcode_macro AUTO_LEVEL_4]
description: Quick 2x2 (4 point) bed mesh, stored as profile "quick"
gcode:
    _LEVEL_COMMON COUNT=2,2 PROFILE=quick

[gcode_macro _LEVEL_COMMON]
gcode:
    {% set count = params.COUNT | default("4,4") %}
    {% set profile = params.PROFILE | default("default") %}
    _PROBE_HEAT
    G28
    CLEAN_NOZZLE HEAT=0
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE={profile} PROBE_COUNT={count}
    G1 Z25 F1200
    M104 S0
    M140 S0
    M117 Mesh "{profile}" done - run SAVE_CONFIG to keep it

# Marlin-compatible entry point so old slicer start G-code still works.
[gcode_macro G29]
description: Runs AUTO_LEVEL_16
gcode:
    AUTO_LEVEL_16

# ---------------------------------------------------------------------------
# Print start / end
# ---------------------------------------------------------------------------

[gcode_macro START_PRINT]
description: Slicer start: START_PRINT BED=60 EXTRUDER=210 MESH=default|quick|none
gcode:
    {% set bed = params.BED | default(50) | int %}
    {% set ext = params.EXTRUDER | default(200) | int %}
    {% set mesh = params.MESH | default("default") %}
    M140 S{bed}
    M104 S150
    G28
    M190 S{bed}
    {% if mesh == "none" %}
        BED_MESH_CLEAR
    {% elif mesh == "new4" %}
        AUTO_LEVEL_4
        BED_MESH_PROFILE LOAD=quick
    {% elif mesh == "new16" %}
        AUTO_LEVEL_16
        BED_MESH_PROFILE LOAD=default
    {% else %}
        BED_MESH_PROFILE LOAD={mesh}
    {% endif %}
    CLEAN_NOZZLE HEAT=0
    M109 S{ext}
    G90
    G92 E0
    # purge line along the front edge
    G1 X5 Y2 Z0.3 F3000
    G1 X60 E8 F1000
    G1 Z1 F600
    G92 E0

[gcode_macro END_PRINT]
gcode:
    M400
    G92 E0
    G1 E-3 F1800
    G91
    G1 Z5 F1200
    G90
    G1 X115 Y110 F6000
    TURN_OFF_HEATERS
    M107
    M84
    M117 Done

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    G91
    G1 Z5 F1200
    G90
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=pause_state
    BASE_PAUSE
    G91
    G1 E-2 F1800
    G1 Z10 F1200
    G90
    G1 X115 Y110 F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E2 F1800
    G90
    RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

# ---------------------------------------------------------------------------
# Filament
# ---------------------------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: LOAD_FILAMENT TEMP=200
gcode:
    {% set t = params.TEMP | default(200) | int %}
    M109 S{t}
    M83
    G1 E60 F300
    G1 E20 F150
    M82
    M117 Loaded

[gcode_macro UNLOAD_FILAMENT]
description: UNLOAD_FILAMENT TEMP=200
gcode:
    {% set t = params.TEMP | default(200) | int %}
    M109 S{t}
    M83
    G1 E5 F300
    G1 E-70 F1200
    M82
    M117 Unloaded

# ---------------------------------------------------------------------------
# Marlin compatibility
# ---------------------------------------------------------------------------

[gcode_macro M300]
description: Beep. M300 S<freq> P<ms>
gcode:
    {% set s = params.S | default(1000) | int %}
    {% set p = params.P | default(100) | int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0 / s if s > 0 else 0.001 }
    G4 P{p}
    SET_PIN PIN=beeper VALUE=0

[gcode_macro M355]
description: Case light. M355 S1|S0
gcode:
    {% set s = params.S | default(1) | int %}
    SET_PIN PIN=case_light VALUE={s}

[gcode_macro LIGHT_ON]
gcode:
    SET_PIN PIN=case_light VALUE=1

[gcode_macro LIGHT_OFF]
gcode:
    SET_PIN PIN=case_light VALUE=0

[gcode_macro M600]
description: Filament change
gcode:
    PAUSE
    UNLOAD_FILAMENT TEMP={printer.extruder.target | int}
