# TEMPORARY (2026-10-28): hotend thermistor is unplugged, so PC1 reads open
# circuit (about -60 C) and Klipper shuts down with "ADC out of range".
# This widens min_temp so it stays up, and makes the hotend heater unusable
# while it can't be measured: targets above 50 C are rejected and heater
# output is capped at 1%. Extrusion stays blocked (reading < min_extrude_temp).
#
# UNDO: delete the [include thermistor-unplugged.cfg] line just above the
# SAVE_CONFIG block in printer.cfg, then FIRMWARE_RESTART.
[extruder]
min_temp: -273.15
max_temp: 50
min_extrude_temp: 50
max_power: 0.01
