# Klipper config for a stock Geeetech M1S (mainboard GT_FM_M1S_V0.2, APM32E103VET6).
#
# Every value that came from the stock Marlin settings dump (M503/M211/M122,
# see docs/probe-log.md) is filled in. Every MCU pin is a placeholder of the
# form P?? and MUST be replaced after the pin map in docs/pinmap.md is
# measured. Klipper will refuse to start until they are.
#
# Pin polarity notes are also placeholders: '!' (invert) and '^' (pull-up) are
# set to what is typical for this kind of board and need checking with
# QUERY_ENDSTOPS / QUERY_PROBE before the first homing move.
#
# SPEED TUNING PASS 1 (over stock): spreadCycle instead of stealthChop,
# run current 0.8 -> 1.0 A, accel 3000 -> 4000, SCV 5 -> 8. Accel is
# deliberately capped at 4000 because the 30 Hz shaper makes anything higher
# pure smoothing. The unlock order is: ADXL baseline sweep, stiffen frame,
# re-sweep, then raise shaper_freq and max_accel together. Search "TUNING"
# below for every knob touched.

[include macros.cfg]
[include KAMP_Settings.cfg]

[mcu]
# CH340C (U14 on the mainboard), 250000 baud, matching stock.
# Confirm the by-id string with: ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300            # TUNING: was 250 (stock advertised). Rarely reachable on a
                             # 115 mm bed; travel moves benefit, print moves are flow-limited.
max_accel: 4000              # TUNING: was 3000 (stock M201). Capped by the 30 Hz shaper:
                             # mzv@30Hz recommends ~3500-4000 max before smoothing dominates.
                             # Raise ONLY together with shaper_freq after stiffening + re-sweep.
minimum_cruise_ratio: 0.5
max_z_velocity: 25           # stock M203 Z
max_z_accel: 500             # stock M201 Z
square_corner_velocity: 8    # TUNING: was 5. Fine with spreadCycle; drop back if corners ring.

[virtual_sdcard]
path: ~/printer_data/gcodes

[force_move]
enable_force_move: True        # bring-up aid: FORCE_MOVE / SET_KINEMATIC_POSITION. Remove after commissioning.

[gcode_arcs]
resolution: 0.1                # G2/G3 support for slicer arc fitting

[firmware_retraction]
retract_length: 3.0            # stock M207 S3
retract_speed: 45              # stock M207 F2700
unretract_extra_length: 0
unretract_speed: 8             # stock M208 F480

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

[temperature_sensor host]
sensor_type: temperature_host

[temperature_sensor mcu]
sensor_type: temperature_mcu   # APM32 internal sensor; comment out if it errors at bring-up

[display_status]
[pause_resume]
[exclude_object]
[respond]

[idle_timeout]
timeout: 900
gcode:
    TURN_OFF_HEATERS
    M84

# ---------------------------------------------------------------------------
# Steppers
#
# Stock steps/mm at 16 microsteps: X 80, Y 80, Z 830, E 570.
# rotation_distance = 200 * 16 / steps_per_mm
# ---------------------------------------------------------------------------

[stepper_x]
step_pin: PB3   # CONFIRMED (X)
dir_pin: PB12   # measured
enable_pin: !PB0   # measured
microsteps: 16
rotation_distance: 40        # 80 steps/mm -> GT2 20T pulley
endstop_pin: ^!PB4            # measured (homes to max)
position_endstop: 115
position_min: 0
position_max: 115
homing_speed: 50             # TUNING: was 40. Plain switch homing, modest bump only.
homing_positive_dir: true

[stepper_y]
step_pin: PA1   # CONFIRMED (Y)
dir_pin: PA0   # measured
enable_pin: !PC7   # measured
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC14            # measured
position_endstop: 0
position_max: 114
homing_speed: 50             # TUNING: was 40

[stepper_z]
step_pin: PA11   # CONFIRMED (Z)
dir_pin: PC15   # measured
enable_pin: !PC13   # measured
microsteps: 16
rotation_distance: 3.8554    # 830 steps/mm. Odd number; verify against the actual Z drive
endstop_pin: ^!PD6            # measured (frame Z button)
position_endstop: -2.8       # trigger point is BELOW the bed plane (button top ~3 mm above Z0,
                             # minus press travel). Calibrate with a paper test after first home.
position_min: -4             # must clear the button trigger depth
position_max: 95
homing_speed: 10
second_homing_speed: 2
homing_retract_dist: 3

[extruder]
step_pin: PC5   # CONFIRMED (E, by extrusion)
dir_pin: PE4   # measured
enable_pin: !PB7   # measured
microsteps: 16
rotation_distance: 5.614     # 570 steps/mm, 5:1 dual-gear direct drive
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5   # KAMP line purge needs fat extrusions allowed
max_extrude_only_distance: 150
max_extrude_only_velocity: 60   # stock M203 E
max_extrude_only_accel: 5000    # stock M201 E
pressure_advance: 0.04          # stock linear advance K 0.10 is a Marlin number, not directly comparable; tune
pressure_advance_smooth_time: 0.040
heater_pin: PB9                 # measured
sensor_type: EPCOS 100K B57560G104F   # PLACEHOLDER: stock thermistor table unknown, check against a reference
sensor_pin: PC1                 # HOTEND sensor (confirmed: PB9 heater heats PC1 fast)
min_temp: 0
max_temp: 280
min_extrude_temp: 170
control: pid                    # stock M301
pid_Kp: 18.80
pid_Ki: 1.39
pid_Kd: 64.34

[heater_bed]
heater_pin: PE0                 # measured
sensor_type: EPCOS 100K B57560G104F   # PLACEHOLDER, same caveat as the hotend
sensor_pin: PC0                 # BED sensor (by elimination)
min_temp: 0
max_temp: 110
control: watermark              # stock bed is bang-bang; run PID_CALIBRATE HEATER=heater_bed TARGET=60 later
max_delta: 1.0

# ---------------------------------------------------------------------------
# TMC2209 on X and Y. UART is wired; Y (addr 3) answers under Marlin, X
# (addr 0) does not. Leave the X block commented until it is tested; X runs
# fine in standalone mode with the hardware defaults.
#
# TUNING: stock ran stealthChop at 0.8 A. spreadCycle (no stealthchop_threshold
# line) gives real torque at speed; that alone is worth more than a motor swap.
# Current raised 0.8 -> 1.0 A. The stock motor's rating is UNKNOWN until the
# case is open: read the motor label, keep run_current <= ~80% of rated, and
# after a 10 min print check the motor is warm not hot (<55-60 C). Plastic
# frame, plastic mounts; a cooked motor softens its own pocket. hold_current
# intentionally not set (Klipper guidance: leave it alone).
# ---------------------------------------------------------------------------

# Y TMC2209 UART pin unknown (PA2 guess failed -> protective shutdown). Runs on
# hardware defaults without UART until the correct uart_pin is found.
#[tmc2209 stepper_y]
#uart_pin: PA2
#uart_address: 3   # PA2=USART2 line (19200 under Marlin); confirm at bring-up
#run_current: 1.0                # TUNING: was 0.800 (stock M906). See rating caveat above.
#interpolate: true
# stealthchop_threshold intentionally omitted -> spreadCycle always.
# To revert to stock-quiet behavior: stealthchop_threshold: 999999

#[tmc2209 stepper_x]
#uart_pin: P??
#uart_address: 0
#run_current: 1.0
#interpolate: true

# Z and E are A4988-class drivers on hardware Vref. Nothing to configure.
# NOTE: X in standalone mode keeps its hardware Vref current; the 0.8 -> 1.0 A
# bump only applies to Y unless the X UART turns out to work (or you turn the
# X Vref pot, if it has one).

# ---------------------------------------------------------------------------
# Fans, lights, buzzer
# ---------------------------------------------------------------------------

[fan]
pin: PE1                        # measured (part cooling)
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: PB8                        # measured (hotend auto fan)
heater: extruder
heater_temp: 50.0

#[controller_fan mainboard_fan]
#pin: PB8                        # no separate mainboard-fan pin found; shares hotend fan
#stepper: stepper_x, stepper_y, stepper_z, extruder
#idle_timeout: 60

[output_pin case_light]
pin: PB15                       # measured (case light)
pwm: false
value: 1

#[output_pin beeper]
#pin: P??                        # beeper - not found; leave until bring-up
#pwm: true
#value: 0
#shutdown_value: 0
#cycle_time: 0.001

# ---------------------------------------------------------------------------
# Load-cell probe. The printhead MCU reads the CS1237 and drives two logic
# lines on the ribbon:
#   Zero  (input to head MCU)  - tare request
#   Level (output, Marlin z_probe) - contact indication
# Observed under Marlin: Level is silent until the head has been tared, and
# about 2 s after a tare it emits one short pulse with no contact. Treat that
# as a "ready" handshake and do not probe until it has passed: _PROBE_TARE
# must dwell (G4 P2500 or similar) after pulsing Zero. Whether Level is a
# held signal or a pulse on contact is not yet measured; Klipper polls the
# endstop fast enough to catch a multi-ms pulse either way.
# If taring once per session proves sufficient, set
# deactivate_on_each_sample: false and drop the per-sample dwell; that is the
# big mesh-speed unlock (16 x ~2.5 s of tare wait disappears).
# ---------------------------------------------------------------------------

#[output_pin probe_tare]
#pin: P??                        # PROBE Zero tare - find at bring-up
#value: 0
#shutdown_value: 0

#[probe]
#pin: ^P??                       # PROBE Level - find at bring-up
#x_offset: 0
#y_offset: 0
#z_offset: 0.02                  # stock M851 Z0.02; recalibrate with PROBE_CALIBRATE
#speed: 3
#lift_speed: 15
#samples: 1
#sample_retract_dist: 2.0
#samples_tolerance: 0.05
#samples_tolerance_retries: 2
#deactivate_on_each_sample: true
#activate_gcode:
#    _PROBE_TARE
#deactivate_gcode:

#[bed_mesh]
#speed: 150                      # TUNING: was 120. Travel between probe points only.
#horizontal_move_z: 3
# Same footprint as the stock 16-point routine: X 10..95, Y 10..100
#mesh_min: 10, 10
#mesh_max: 95, 100
#probe_count: 4, 4
#algorithm: bicubic
#fade_start: 1
#fade_end: 10                    # stock fade height 10 mm
#mesh_pps: 2, 2

# Z homes on the frame Z-button (endstop PD6) at nozzle X115 Y0, matching stock.
# safe_z_home homes X and Y first, moves to the button, then homes Z.
[safe_z_home]
home_xy_position: 115, 0
speed: 100
z_hop: 8
z_hop_speed: 10

# Input shaper: stock used 30 Hz / 0.20 damping on both axes. This is the
# ceiling on max_accel; do not raise accel past ~4000 until an accelerometer
# sweep says the frame can carry a higher shaper_freq.
[input_shaper]
shaper_freq_x: 30
shaper_type_x: mzv
shaper_freq_y: 30
shaper_type_y: mzv

# ---------------------------------------------------------------------------
# Resonance testing. ADXL345 on the Pi host's SPI, moved to the toolhead /
# bed for the X / Y sweeps. Uncomment when wired; needs
# "sudo raspi-config" SPI enabled and the klipper rpi mcu service
# (make menuconfig -> Linux process) on the host.
# ---------------------------------------------------------------------------

#[mcu host]
#serial: /tmp/klipper_host_mcu

#[adxl345]
#cs_pin: host:None
#spi_bus: spidev0.0

#[resonance_tester]
#accel_chip: adxl345
#probe_points: 57.5, 55, 20

[filament_switch_sensor runout]
switch_pin: ^PA15                # measured
pause_on_runout: true
runout_gcode:
    M117 Filament runout
insert_gcode:
    M117 Filament inserted
event_delay: 3.0
pause_delay: 0.5