# Klipper config for a stock Geeetech M1S (mainboard GT_FM_M1_V0.4, APM32E103VET6).
#
# Every value that came from the stock Marlin settings dump (M503/M211/M122,
# see docs/probe-log.md) is filled in. Every MCU pin is a placeholder of the
# form P?? and MUST be replaced after the pin map in docs/pinmap.md is
# measured. Klipper will refuse to start until they are.
#
# Pin polarity notes are also placeholders: '!' (invert) and '^' (pull-up) are
# set to what is typical for this kind of board and need checking with
# QUERY_ENDSTOPS / QUERY_PROBE before the first homing move.

[include macros.cfg]

[mcu]
# CH340 bridge on the display board, 250000 baud, matching stock.
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250            # Geeetech advertises 250 mm/s; Marlin limited X/Y to 200
max_accel: 3000              # stock M201 X/Y
max_z_velocity: 25           # stock M203 Z
max_z_accel: 500             # stock M201 Z
square_corner_velocity: 5

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]
[respond]

[idle_timeout]
timeout: 900
gcode:
    TURN_OFF_HEATERS
    M84

# ---------------------------------------------------------------------------
# Steppers
#
# Stock steps/mm at 16 microsteps: X 80, Y 80, Z 830, E 570.
# rotation_distance = 200 * 16 / steps_per_mm
# ---------------------------------------------------------------------------

[stepper_x]
step_pin: P??
dir_pin: P??
enable_pin: !P??
microsteps: 16
rotation_distance: 40        # 80 steps/mm -> GT2 20T pulley
endstop_pin: ^P??            # X_MIN on the printhead ribbon, but stock homes to MAX
position_endstop: 115
position_min: 0
position_max: 115
homing_speed: 40
homing_positive_dir: true

[stepper_y]
step_pin: P??
dir_pin: P??
enable_pin: !P??
microsteps: 16
rotation_distance: 40
endstop_pin: ^P??            # Y-MIN connector on the mainboard
position_endstop: 0
position_max: 114
homing_speed: 40

[stepper_z]
step_pin: P??
dir_pin: P??
enable_pin: !P??
microsteps: 16
rotation_distance: 3.8554    # 830 steps/mm. Odd number; verify against the actual Z drive
endstop_pin: ^P??            # Z microswitch PCB in the base
position_endstop: 0.0        # stock probe Z offset was 0.02 relative to nozzle; tune with Z_OFFSET_APPLY_ENDSTOP
position_min: -1
position_max: 95
homing_speed: 10
second_homing_speed: 2
homing_retract_dist: 3

[extruder]
step_pin: P??
dir_pin: P??
enable_pin: !P??
microsteps: 16
rotation_distance: 5.614     # 570 steps/mm, 5:1 dual-gear direct drive
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
max_extrude_only_velocity: 60   # stock M203 E
max_extrude_only_accel: 5000    # stock M201 E
pressure_advance: 0.04          # stock linear advance K 0.10 is a Marlin number, not directly comparable; tune
pressure_advance_smooth_time: 0.040
heater_pin: P??                 # HED via the ribbon
sensor_type: EPCOS 100K B57560G104F   # PLACEHOLDER: stock thermistor table unknown, check against a reference
sensor_pin: P??                 # TH0 via the ribbon
min_temp: 0
max_temp: 280
min_extrude_temp: 170
control: pid                    # stock M301
pid_Kp: 18.80
pid_Ki: 1.39
pid_Kd: 64.34

[heater_bed]
heater_pin: P??                 # BED+/BED- on the mainboard
sensor_type: EPCOS 100K B57560G104F   # PLACEHOLDER, same caveat as the hotend
sensor_pin: P??                 # TB
min_temp: 0
max_temp: 110
control: watermark              # stock bed is bang-bang; run PID_CALIBRATE HEATER=heater_bed TARGET=60 later
max_delta: 1.0

# ---------------------------------------------------------------------------
# TMC2209 on X and Y. UART is wired; Y (addr 3) answers under Marlin, X
# (addr 0) does not. Leave the X block commented until it is tested; X runs
# fine in standalone mode with the hardware defaults.
# ---------------------------------------------------------------------------

[tmc2209 stepper_y]
uart_pin: P??
uart_address: 3
run_current: 0.800              # stock M906 Y800
hold_current: 0.400
stealthchop_threshold: 999999   # stock ran stealthChop
interpolate: true

#[tmc2209 stepper_x]
#uart_pin: P??
#uart_address: 0
#run_current: 0.800
#hold_current: 0.400
#stealthchop_threshold: 999999
#interpolate: true

# Z and E are A4988-class drivers on hardware Vref. Nothing to configure.

# ---------------------------------------------------------------------------
# Fans, lights, buzzer
# ---------------------------------------------------------------------------

[fan]
pin: P??                        # FAN2 on the ribbon -> "Blower" (part cooling) on the head board. Swap with FAN1 if wrong.
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: P??                        # FAN1 on the ribbon -> "FAN" on the head board
heater: extruder
heater_temp: 50.0

[controller_fan mainboard_fan]
pin: P??                        # FAN-/FAN+ on the mainboard
stepper: stepper_x, stepper_y, stepper_z, extruder
idle_timeout: 60

[output_pin case_light]
pin: P??                        # stock M355
pwm: false
value: 1

[output_pin beeper]
pin: P??                        # active buzzer next to the MCU
pwm: true
value: 0
shutdown_value: 0
cycle_time: 0.001

# ---------------------------------------------------------------------------
# Load-cell probe. The printhead MCU reads the CS1237 and drives two logic
# lines on the ribbon:
#   Zero  (input to head MCU)  - tare request
#   Level (output, Marlin z_probe) - contact indication
# Observed under Marlin: Level is silent until the head has been tared, and
# about 2 s after a tare it emits one short pulse with no contact. Treat that
# as a "ready" handshake and do not probe until it has passed. Whether Level
# is a held signal or a pulse on contact is not yet measured; Klipper polls
# the endstop fast enough to catch a multi-ms pulse either way.
# ---------------------------------------------------------------------------

[output_pin probe_tare]
pin: P??                        # Zero on the ribbon
value: 0
shutdown_value: 0

[probe]
pin: ^P??                       # Level on the ribbon; add '!' if it idles high
x_offset: 0
y_offset: 0
z_offset: 0.02                  # stock M851 Z0.02; recalibrate with PROBE_CALIBRATE
speed: 3
lift_speed: 15
samples: 1
sample_retract_dist: 2.0
samples_tolerance: 0.05
samples_tolerance_retries: 2
deactivate_on_each_sample: true
activate_gcode:
    _PROBE_TARE
deactivate_gcode:

[bed_mesh]
speed: 120
horizontal_move_z: 3
# Same footprint as the stock 16-point routine: X 10..95, Y 10..100
mesh_min: 10, 10
mesh_max: 95, 100
probe_count: 4, 4
algorithm: bicubic
fade_start: 1
fade_end: 10                    # stock fade height 10 mm
mesh_pps: 2, 2

[safe_z_home]
home_xy_position: 57.5, 55
speed: 100
z_hop: 5
z_hop_speed: 10

# Input shaper: stock used 30 Hz / 0.20 damping on both axes. Keep it until an
# accelerometer run gives better numbers.
[input_shaper]
shaper_freq_x: 30
shaper_type_x: mzv
shaper_freq_y: 30
shaper_type_y: mzv

[filament_switch_sensor runout]
switch_pin: ^P??                # reads TRIGGERED with filament under Marlin; add '!' if inverted
pause_on_runout: true
runout_gcode:
    M117 Filament runout
insert_gcode:
    M117 Filament inserted
event_delay: 3.0
pause_delay: 0.5
