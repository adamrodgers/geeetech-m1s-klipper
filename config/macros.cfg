# Macros for the Geeetech M1S under Klipper.
#
# Positions used by the nozzle wipe are variables on _M1S_VARS so they can be
# changed from the console with SET_GCODE_VARIABLE while finding the pad.
# The stock firmware's G29 sequence is: heat nozzle to 140 C and bed to 50 C,
# wipe, tare the probe, probe. CLEAN_NOZZLE / AUTO_LEVEL_* reproduce that.

[gcode_macro _M1S_VARS]
description: Tunables for the M1S macros
# Silicone wiper pad, measured by jogging (2026-08-26): X 35..69, Y 110..114,
# pad top surface at Z ~3.0. Wipe along X, slightly pressed into the pad.
variable_wipe_x_start: 38
variable_wipe_x_end: 66
variable_wipe_y: 112
variable_wipe_z: 2.0
variable_wipe_passes: 6
variable_wipe_speed: 6000      # mm/min
variable_probe_nozzle_temp: 175
variable_probe_bed_temp: 50
variable_tare_settle: 3.0      # seconds to wait after a tare before probing
# Filament load/unload park spot: off the bed's right edge, 25 mm forward of
# the Z reference button at Y0 so purge never lands on it (stock firmware bug).
variable_filament_park_x: 110    # off the bed, in the strip between bed edge and Z post (clean up after)
variable_filament_park_y: 55
gcode:

# ---------------------------------------------------------------------------
# Probe helpers
# ---------------------------------------------------------------------------

[gcode_macro _MSG]
description: Console status line (Mainsail). Usage: _MSG MSG="text"
gcode:
    RESPOND TYPE=echo MSG="M1S: {params.MSG}"

[gcode_macro _PROBE_TARE]
description: Pulse the head MCU tare line and wait out its ready pulse
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    SET_PIN PIN=probe_tare VALUE=1
    G4 P50
    SET_PIN PIN=probe_tare VALUE=0
    G4 P{ (v.tare_settle * 1000) | int }

[gcode_macro _PROBE_HEAT]
description: Bring nozzle and bed to the stock probing temperatures
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    M140 S{v.probe_bed_temp}
    M104 S{v.probe_nozzle_temp}
    M190 S{v.probe_bed_temp}
    M109 S{v.probe_nozzle_temp}

# ---------------------------------------------------------------------------
# Nozzle cleaning
# ---------------------------------------------------------------------------

[gcode_macro CLEAN_NOZZLE]
description: Wipe the nozzle on the silicone pad. HEAT=0 skips heating.
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    {% set heat = params.HEAT | default(1) | int %}
    {% set label = params.LABEL | default("Cleaning nozzle") %}
    _MSG MSG="{label}"
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _MSG MSG="Homing (needed before clean)"
        G28
    {% endif %}
    {% if heat %}
        M109 S{v.probe_nozzle_temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=clean_nozzle
    G90
    G1 Z{v.wipe_z + 6} F1200
    G1 X{v.wipe_x_start} Y{v.wipe_y} F{v.wipe_speed}
    G1 Z{v.wipe_z} F600
    {% for i in range(v.wipe_passes) %}
        G1 X{v.wipe_x_end} F{v.wipe_speed}
        G1 X{v.wipe_x_start} F{v.wipe_speed}
    {% endfor %}
    G1 E-0.6 F1800          # tiny retract to curb ooze after wiping
    G1 Z{v.wipe_z + 5} F1200
    RESTORE_GCODE_STATE NAME=clean_nozzle

# ---------------------------------------------------------------------------
# Bed leveling. Both variants heat, wipe, tare, then probe. The mesh is saved
# under a profile; run SAVE_CONFIG afterwards to persist it.
# ---------------------------------------------------------------------------

[gcode_macro AUTO_LEVEL_16]
description: Full 4x4 (16 point) bed mesh, same as the stock auto-level
gcode:
    _LEVEL_COMMON COUNT=4,4 PROFILE=default

[gcode_macro AUTO_LEVEL_4]
description: Quick 2x2 (4 point) bed mesh, stored as profile "quick"
gcode:
    _LEVEL_COMMON COUNT=2,2 PROFILE=quick

[gcode_macro _LEVEL_COMMON]
gcode:
    {% set count = params.COUNT | default("4,4") %}
    {% set profile = params.PROFILE | default("default") %}
    _MSG MSG="Auto bed leveling ({count} grid)"
    _PROBE_HEAT
    G28
    CLEAN_NOZZLE HEAT=0
    BED_MESH_CLEAR
    _MSG MSG="Probing bed mesh..."
    BED_MESH_CALIBRATE PROFILE={profile} PROBE_COUNT={count}
    G1 Z25 F1200
    M104 S0
    M140 S0
    _MSG MSG="Mesh '{profile}' done - run SAVE_CONFIG to keep it"

# Marlin-compatible entry point so old slicer start G-code still works.
[gcode_macro G29]
description: Runs AUTO_LEVEL_16
gcode:
    AUTO_LEVEL_16

# ---------------------------------------------------------------------------
# Print start / end
# ---------------------------------------------------------------------------

[gcode_macro START_PRINT]
description: Slicer start: START_PRINT BED=60 EXTRUDER=200 SOAK=0
gcode:
    {% set bed = params.BED | default(60) | int %}
    {% set ext = params.EXTRUDER | default(200) | int %}
    {% set soak = params.SOAK | default(0) | int %}
    {% set clean = printer["gcode_macro _M1S_VARS"].probe_nozzle_temp | int %}
    _MSG MSG="Print start: bed {bed}C, nozzle {ext}C"
    _MSG MSG="Heating bed to {bed}C"
    M140 S{bed}                 # start bed heating (background)
    _MSG MSG="Homing all axes"
    G28
    _MSG MSG="Heating nozzle to {clean}C for cleaning"
    M104 S{clean}
    M109 S{clean}
    CLEAN_NOZZLE HEAT=0 LABEL="First nozzle clean"
    _MSG MSG="Waiting for bed to reach {bed}C"
    M190 S{bed}
    {% if soak > 0 %}
        _MSG MSG="Heat soaking bed for {soak}s"
        G4 P{soak * 1000}
    {% endif %}
    _MSG MSG="Heating nozzle to {ext}C"
    M104 S{ext}
    M109 S{ext}
    CLEAN_NOZZLE HEAT=0 LABEL="Second nozzle clean"
    _MSG MSG="Re-homing Z with clean hot nozzle"
    G28 Z                       # accurate Z ref: clean nozzle, at print temp
    _MSG MSG="Loading bed mesh"
    BED_MESH_PROFILE LOAD=default
    _MSG MSG="Purging"
    G90
    M83
    G92 E0
    G1 Z6 F600
    G1 X8 Y6 F3000
    G1 Z0.3 F300
    G1 E20 F150                 # stationary purge glob - drags ooze/blob off the nozzle
    G1 X95 Y6 E5.2 F800
    G1 X95 Y8 F1200
    G1 X8 Y8 E5.2 F800
    G92 E0
    _MSG MSG="Starting print"

[gcode_macro END_PRINT]
gcode:
    _MSG MSG="Print finished - cooling down"
    M400
    G92 E0
    G1 E-3 F1800
    G91
    G1 Z5 F1200
    G90
    G1 X115 Y110 F6000
    TURN_OFF_HEATERS
    M107
    M84

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    _MSG MSG="Print cancelled"
    TURN_OFF_HEATERS
    M107
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    G91
    G1 Z5 F1200
    G90
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    _MSG MSG="Paused - parking"
    SAVE_GCODE_STATE NAME=pause_state
    BASE_PAUSE
    G91
    G1 E-2 F1800
    G1 Z10 F1200
    G90
    G1 X115 Y110 F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    _MSG MSG="Resuming"
    G91
    G1 E2 F1800
    G90
    RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

# ---------------------------------------------------------------------------
# Filament
# ---------------------------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: LOAD_FILAMENT TEMP=200 OFF=1 (OFF=0 keeps the hotend hot)
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    {% set t = params.TEMP | default(200) | int %}
    {% set off = params.OFF | default(1) | int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _MSG MSG="Homing for filament change"
        G28
    {% endif %}
    G90
    G1 Z{ [printer.toolhead.position.z, 20] | max } F1200   # raise for clearance
    G1 X{v.filament_park_x} Y{v.filament_park_y} F6000       # move to clear purge spot
    G1 Z8 F600                                              # lower to a tidy purge height
    _MSG MSG="Loading filament - heating to {t}C"
    M109 S{t}
    _MSG MSG="Feeding filament"
    M83
    G1 E60 F300          ; fast feed through the path
    G1 E20 F150          ; slow prime through the melt zone
    G1 E-1 F1800         ; small retract to curb ooze
    M82
    {% if off %}
        M104 S0          ; hotend off when done (skip with OFF=0)
        _MSG MSG="Filament loaded - cooling"
    {% else %}
        _MSG MSG="Filament loaded"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: UNLOAD_FILAMENT TEMP=200 OFF=1 (OFF=0 keeps the hotend hot, e.g. for M600)
gcode:
    {% set v = printer["gcode_macro _M1S_VARS"] %}
    {% set t = params.TEMP | default(200) | int %}
    {% set off = params.OFF | default(1) | int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _MSG MSG="Homing for filament change"
        G28
    {% endif %}
    G90
    G1 Z{ [printer.toolhead.position.z, 20] | max } F1200   # raise for clearance
    G1 X{v.filament_park_x} Y{v.filament_park_y} F6000       # move to clear purge spot
    G1 Z8 F600                                              # lower to a tidy purge height
    _MSG MSG="Unloading filament - heating to {t}C"
    M109 S{t}
    _MSG MSG="Retracting filament"
    M83
    G1 E5 F300           ; tip shaping nudge
    G1 E-70 F1200        ; retract out of the path
    M82
    {% if off %}
        M104 S0          ; hotend off when done (skip with OFF=0)
        _MSG MSG="Filament unloaded - cooling"
    {% else %}
        _MSG MSG="Filament unloaded"
    {% endif %}

# ---------------------------------------------------------------------------
# Marlin compatibility
# ---------------------------------------------------------------------------

[gcode_macro M300]
description: Beep. M300 S<freq> P<ms>
gcode:
    {% set s = params.S | default(1000) | int %}
    {% set p = params.P | default(100) | int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0 / s if s > 0 else 0.001 }
    G4 P{p}
    SET_PIN PIN=beeper VALUE=0

[gcode_macro M355]
description: Case light. M355 S1|S0
gcode:
    {% set s = params.S | default(1) | int %}
    SET_PIN PIN=case_light VALUE={s}

[gcode_macro LIGHT_ON]
gcode:
    SET_PIN PIN=case_light VALUE=1

[gcode_macro LIGHT_OFF]
gcode:
    SET_PIN PIN=case_light VALUE=0

[gcode_macro M600]
description: Filament change (keeps hotend hot for the swap)
gcode:
    {% set t = printer.extruder.target | int if printer.extruder.target > 170 else 200 %}
    PAUSE
    UNLOAD_FILAMENT TEMP={t} OFF=0
